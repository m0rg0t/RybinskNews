name: Portable source regressions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Run source-linked synthetic regressions (no package sources)
        run: dotnet run --project tests/Portable.Tests/Portable.Tests.csproj --configuration Release
